name: ai_vision_traffic_scanner
description: A Flutter mobile app for YOLO-based vehicle detection, tracking, and counting.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
